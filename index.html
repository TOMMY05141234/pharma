<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="薬剤師のこれからを考えるメディア、薬剤師キャリアノート。ファルマスタッフとファル・メイトを比較できます。">
  <meta name="robots" content="index,follow">
  <title>薬剤師キャリアノート｜薬剤師転職サービス比較</title>
  <link rel="preload" as="image" href="assets/pharmacist-career-note-lp.jpeg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="lp" aria-label="薬剤師キャリアノート">
    <div class="lp-image-wrap">
      <img class="lp-image" src="assets/pharmacist-career-note-lp.jpeg" width="729" height="1536" alt="薬剤師キャリアノート。今の職場、このままでいいのかな？ 薬剤師向け転職サービスのファルマスタッフとファル・メイトを比較できます。">

      <!-- 上部の導線はサービス比較欄までスクロールします。 -->
      <a class="hotspot compare top-compare" href="#service-links" aria-label="転職サービスを比較する"></a>
      <a class="hotspot compare hero-cta" href="#service-links" aria-label="自分に合う求人を見てみる"></a>

      <!-- 公式URLを仮設定。ASPリンク取得後は下記hrefだけ差し替えてください。 -->
      <span id="service-links" class="scroll-target" aria-hidden="true"></span>
      <a class="hotspot outbound staff staff-card" href="https://www.38-8931.com/" target="_blank" rel="sponsored noopener" data-offer="pharmastaff" aria-label="ファルマスタッフの求人を見る（新しいタブで開きます）"></a>
      <a class="hotspot outbound mate mate-card" href="https://www.pharmate.jp/" target="_blank" rel="sponsored noopener" data-offer="pharmate" aria-label="ファル・メイトの求人を見る（新しいタブで開きます）"></a>
      <a class="hotspot outbound staff staff-choice" href="https://www.38-8931.com/" target="_blank" rel="sponsored noopener" data-offer="pharmastaff" aria-label="じっくり相談したい人向け、ファルマスタッフ（新しいタブで開きます）"></a>
      <a class="hotspot outbound mate mate-choice" href="https://www.pharmate.jp/" target="_blank" rel="sponsored noopener" data-offer="pharmate" aria-label="柔軟な働き方を探したい人向け、ファル・メイト（新しいタブで開きます）"></a>
      <a class="hotspot outbound staff staff-final" href="https://www.38-8931.com/" target="_blank" rel="sponsored noopener" data-offer="pharmastaff" aria-label="ファルマスタッフで求人を見る（新しいタブで開きます）"></a>
      <a class="hotspot outbound mate mate-final" href="https://www.pharmate.jp/" target="_blank" rel="sponsored noopener" data-offer="pharmate" aria-label="ファル・メイトで求人を見る（新しいタブで開きます）"></a>
    </div>
  </main>

  <script>
    document.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        const target = document.querySelector(link.getAttribute('href'));
        if (!target) return;
        event.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  </script>
</body>
</html>
